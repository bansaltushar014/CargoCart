[package]
name = "my_crud_project"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenv = "0.15"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7.10"
native-tls = "0.2"
postgres-native-tls = "0.5.1"
chrono = "0.4"
actix-web = "4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
env_logger = "0.10.0"